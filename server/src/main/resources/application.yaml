spring:
  application:
    name: spacefurni
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:spacefurni}
    username: ${POSTGRES_USER:spacefurni}
    password: ${POSTGRES_PASSWORD:spacefurni}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 8080

spacefurni:
  jwt:
    secret: ${JWT_SECRET:replace-with-a-long-random-string-in-every-environment}
    access-token-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}
    issuer: ${JWT_ISSUER:spacefurni}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
  storage:
    product-images-directory: ${PRODUCT_IMAGES_DIRECTORY:uploads/products}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:8080}
